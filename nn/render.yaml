# Blueprint per "Luisa e Nico" (clone di N&N Ideas, dati separati). Path del blueprint: nn/render.yaml, branch ln-app.
services:
  - type: web
    name: luisa-e-nico
    runtime: node
    region: frankfurt
    plan: starter
    branch: ln-app
    rootDir: nn
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: ln-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: XAI_API_KEY
        sync: false
      - key: NN_TOKEN_NICO
        sync: false
      - key: NN_TOKEN_NICOLA
        sync: false
